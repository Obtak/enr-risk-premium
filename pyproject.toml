[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enr-risk-premium"
version = "0.1.0"
description = "Simulation et pricing des risques de production ENR"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<25",
    "openpyxl>=3.1,<4",
    "scipy>=1.15,<2",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4,<5",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"